name: Déploiement production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      NOTION_DEPLOYMENTS_DB: 9cbb9e80-e451-47eb-9f78-664251cb60da
    steps:
      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/pokegames && git pull --ff-only && npm ci \
              && ( cd apps/api && npx prisma migrate deploy && npx prisma generate ) \
              && npm run build -w @pokegames/api && npm run build -w @pokegames/web \
              && pm2 restart pokegames-api

      - name: Notifier Notion — succès
        if: success()
        run: |
          curl -sS -X POST https://api.notion.com/v1/pages \
            -H "Authorization: Bearer ${{ secrets.NOTION_TOKEN }}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg db "$NOTION_DEPLOYMENTS_DB" \
              --arg titre "Déploiement pokegames $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg commit "${{ github.event.workflow_run.head_sha }}" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                parent: { database_id: $db },
                properties: {
                  "Titre": { title: [{ text: { content: $titre } }] },
                  "Projet": { select: { name: "pokegames" } },
                  "Statut": { select: { name: "Réussi" } },
                  "Commit": { rich_text: [{ text: { content: $commit } }] },
                  "Déployé le": { date: { start: $date } },
                  "Lien du run": { url: $run }
                }
              }')"

      - name: Notifier Notion — échec
        if: failure()
        run: |
          curl -sS -X POST https://api.notion.com/v1/pages \
            -H "Authorization: Bearer ${{ secrets.NOTION_TOKEN }}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg db "$NOTION_DEPLOYMENTS_DB" \
              --arg titre "Déploiement pokegames $(date -u +%Y-%m-%dT%H:%M:%SZ) — ÉCHEC" \
              --arg commit "${{ github.event.workflow_run.head_sha }}" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                parent: { database_id: $db },
                properties: {
                  "Titre": { title: [{ text: { content: $titre } }] },
                  "Projet": { select: { name: "pokegames" } },
                  "Statut": { select: { name: "Échec" } },
                  "Commit": { rich_text: [{ text: { content: $commit } }] },
                  "Déployé le": { date: { start: $date } },
                  "Lien du run": { url: $run }
                }
              }')"
