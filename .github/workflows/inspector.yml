name: Inspecteur (revue de mission)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model sonnet
            --effort medium
            --disallowedTools Task
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Tu ES toi-même l'agent inspecteur, dans cette session, maintenant.
            N'utilise JAMAIS l'outil Task ou Agent pour te déléguer ce travail
            à un sous-agent en arrière-plan : cette session s'arrête dès que
            ton tour se termine, un sous-agent en tâche de fond n'aurait
            jamais l'occasion de terminer. Exécute toi-même, directement,
            toutes les commandes Bash et lectures nécessaires.

            Lis .claude/agents/inspector.md à la racine du repo et applique
            exactement sa procédure, toi-même, sans en dévier.
