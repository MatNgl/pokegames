name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pokegames
          POSTGRES_PASSWORD: pokegames_secret_password
          POSTGRES_DB: pokegames_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U pokegames"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pokegames:pokegames_secret_password@localhost:5434/pokegames_db?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      PORT: 3001
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: pokegames_secret_jwt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
      - run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - run: npm run verify
