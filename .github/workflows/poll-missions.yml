name: Poll missions (ping routine)

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher la routine Poll missions pokegames
        run: |
          curl -sS -f -X POST \
            https://api.anthropic.com/v1/claude_code/routines/trig_016z5CFKy1uswKqDst6UbxHe/fire \
            -H "Authorization: Bearer ${{ secrets.ROUTINE_TRIGGER_TOKEN }}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d '{}'
