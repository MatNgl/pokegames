<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fond badge carré arrondi rétro -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#181825" stroke="#28338c" stroke-width="4"/>
  
  <!-- Ligne et cercle Pokéball en arrière-plan subtil -->
  <path d="M 2 32 L 62 32" stroke="#28338c" stroke-width="3" opacity="0.4"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#28338c" stroke-width="3" opacity="0.4"/>

  <!-- Ombre portée 3D de la lettre P (couleur indigo rétro #28338c) -->
  <path d="M 18 14 H 42 C 52 14 52 34 42 34 H 28 V 50 H 18 Z M 28 22 V 26 H 40 C 44 26 44 22 40 22 Z" fill-rule="evenodd" fill="#28338c" transform="translate(3, 4)"/>

  <!-- Lettre P principale (jaune lumineux Pokémon #ffcc00 avec contour bleu nuit #28338c) -->
  <path d="M 18 14 H 42 C 52 14 52 34 42 34 H 28 V 50 H 18 Z M 28 22 V 26 H 40 C 44 26 44 22 40 22 Z" fill-rule="evenodd" fill="#ffcc00" stroke="#28338c" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Reflet brillant sur le coin haut gauche du P -->
  <rect x="21" y="17" width="4" height="14" rx="2" fill="#ffffff" opacity="0.6"/>
</svg>