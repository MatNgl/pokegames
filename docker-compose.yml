version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pokegames-db
    restart: always
    environment:
      POSTGRES_USER: pokegames
      POSTGRES_PASSWORD: pokegames_secret_password
      POSTGRES_DB: pokegames_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pokegames_network

  redis:
    image: redis:7-alpine
    container_name: pokegames-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - pokegames_network

volumes:
  postgres_data:
  redis_data:

networks:
  pokegames_network:
    driver: bridge